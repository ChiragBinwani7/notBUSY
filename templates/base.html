<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Textile Accounting System{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <nav>
        <div class="container">
            <a href="/" class="nav-brand">📦 Textile Accounting</a>
            <ul>
                <li><a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a></li>
                <li><a href="/purchases" {% if request.url.path.startswith("/purchases") %}class="active"{% endif %}>Purchases</a></li>
                <li><a href="/mill" {% if request.url.path.startswith("/mill") %}class="active"{% endif %}>Mill Jobs</a></li>
                <li><a href="/invoices" {% if request.url.path.startswith("/invoices") %}class="active"{% endif %}>Invoices</a></li>
                <li><a href="/payments" {% if request.url.path.startswith("/payments") %}class="active"{% endif %}>Payments</a></li>
                <li><a href="/gst" {% if request.url.path.startswith("/gst") %}class="active"{% endif %}>GST Reports</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
