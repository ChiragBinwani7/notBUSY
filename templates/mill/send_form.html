{% extends "base.html" %}

{% block title %}Send to Mill{% endblock %}

{% block content %}
<h1>Send to Mill</h1>

<div class="card">
    <form method="POST" action="/mill/send">
        <div class="form-group">
            <label>Mill Name</label>
            <input type="text" name="mill_name" required>
        </div>

        <div class="form-group">
            <label>Product</label>
            <select name="product_id" id="productSelect" onchange="updateRawCategory()" required>
                {% for product in products %}
                <option value="{{ product.id }}" data-name="{{ product.name }}">{{ product.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Auto-populated from selected product -->
        <input type="hidden" name="raw_category" id="rawCategory">

        <div class="form-group">
            <label>Expected Finished Variant</label>
            <input type="text" name="finished_variant" placeholder="e.g., Bright Lycra 26G or TBD" required>
            <small>Enter specific variant name or <strong>TBD</strong> to finalize later when receiving from mill.</small>
        </div>

        <div class="form-group">
            <label>Grey Quantity (takas or kg)</label>
            <input type="number" step="0.01" name="grey_quantity" required>
        </div>

        <button type="submit" class="btn">Send to Mill</button>
        <a href="/mill" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
    function updateRawCategory() {
        const select = document.getElementById('productSelect');
        const option = select.options[select.selectedIndex];
        document.getElementById('rawCategory').value = option.getAttribute('data-name') || '';
    }
    // Set initial value on page load
    updateRawCategory();
</script>
{% endblock %}
