{% extends "base.html" %}

{% block title %}New Purchase{% endblock %}

{% block content %}
<div class="card">
    <h2>New Purchase</h2>
    <form method="post" action="/purchases/create" id="purchaseForm">
        <div class="form-group">
            <label>Vendor Name:</label>
            <input type="text" name="vendor_name" required>
        </div>

        <div class="form-group">
            <label>Vendor State:</label>
            <input type="text" name="vendor_state" required>
        </div>

        <div class="form-group">
            <label>Product:</label>
            <select name="product_id" required>
                {% for product in products %}
                <option value="{{ product.id }}">{{ product.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Quantity (takas or kg):</label>
            <input type="number" step="0.01" name="quantity" required>
        </div>

        <div class="form-group">
            <label>Purchase Value (₹):</label>
            <input type="number" step="0.01" name="purchase_value" required>
        </div>

        <div class="form-group">
            <label>GST Amount (₹):</label>
            <input type="number" step="0.01" name="gst_amount" required>
        </div>

        <hr>

        <div class="form-group">
            <label>
                <input type="checkbox" name="send_to_mill" id="sendToMillCheckbox" value="true">
                Send directly to Mill
            </label>
        </div>

        <div id="millFields" style="display: none;">
            <div class="form-group">
                <label>Mill Name:</label>
                <input type="text" name="mill_name" id="millNameInput">
            </div>

            <div class="form-group">
                <label>Expected Finished Variant:</label>
                <input type="text" name="expected_finished_variant" id="variantInput"
                    placeholder="e.g., Bright Lycra 26G or TBD">
                <small>Enter specific variant or "TBD" to finalize later</small>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit">Create Purchase</button>
            <a href="/purchases" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('sendToMillCheckbox').addEventListener('change', function () {
        const millFields = document.getElementById('millFields');
        const millNameInput = document.getElementById('millNameInput');
        const variantInput = document.getElementById('variantInput');

        if (this.checked) {
            millFields.style.display = 'block';
            millNameInput.required = true;
            variantInput.required = true;
        } else {
            millFields.style.display = 'none';
            millNameInput.required = false;
            variantInput.required = false;
            millNameInput.value = '';
            variantInput.value = '';
        }
    });
</script>
{% endblock %}
